name: Focus Flow - Linked Sequence Checklists
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Add checklists without changing source apps
        run: |
          python3 - <<'PY'
          import base64
          exec(compile(base64.b64decode(''),'<update>','exec'))
          PY
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/LinkedActivities.jsx src/HomeWorkouts.jsx src/LinkedSteps.jsx
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Display local subtasks for linked sequences"
            git push
          fi
