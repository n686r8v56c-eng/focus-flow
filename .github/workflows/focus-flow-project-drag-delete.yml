name: Focus Flow - Project Drag and Safe Delete
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: focus-flow-project-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply project updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/App.jsx'); s=p.read_text(encoding='utf-8'); original=s
          
          def replace_once(a,b):
           global s
           if s.count(a)!=1: raise RuntimeError(f'Expected unique anchor, found {s.count(a)}: {a[:70]}')
           s=s.replace(a,b,1)
          
          # Keep all tasks and sessions. Removing a project just unassigns its tasks.
          anchor='  const removeTask = (id) => {'
          insert='''  const deleteSelectedProject = () => {
              const item = data.projects.find(p => p.id === selectedProject);
              if (!item || !window.confirm(`프로젝트 “${item.name}”을 삭제할까?\\n소속 할 일은 삭제하지 않고 개인 일정으로 옮겨져.`)) return;
              update(d => ({
                ...d,
                projects: d.projects.filter(p => p.id !== item.id),
                tasks: d.tasks.map(t => t.projectId === item.id ? {...t, projectId: null} : t),
              }));
              setSelectedProject(data.projects.find(p => p.id !== item.id)?.id || "");
            };
            const moveProjectTask = (movingId, targetId) => {
              if (!targetId || movingId === targetId) return;
              update(d => {
                const moving = d.tasks.find(t => t.id === movingId);
                const target = d.tasks.find(t => t.id === targetId);
                if (!moving || !target || moving.projectId !== target.projectId || moving.status !== target.status) return d;
                const group = d.tasks.filter(t => t.projectId === moving.projectId && t.status === moving.status)
                  .sort((a,b) => (a.order ?? 0)-(b.order ?? 0) || (a.due || "9999").localeCompare(b.due || "9999") || (a.time || "").localeCompare(b.time || ""));
                const reordered = group.filter(t => t.id !== movingId);
                const destination = reordered.findIndex(t => t.id === targetId);
                if (destination < 0) return d;
                reordered.splice(destination, 0, moving);
                const positions = new Map(reordered.map((t,i)=>[t.id,i]));
                return {...d, tasks: d.tasks.map(t => positions.has(t.id) ? {...t,order:positions.get(t.id)} : t)};
              });
            };
            const dragProjectTask = useRef(null);
            const projectDragCleanup = useRef(null);
            useEffect(() => () => projectDragCleanup.current?.(), []);
            const startProjectDrag = (event, task) => {
              if (event.button !== 0 && event.pointerType === "mouse") return;
              event.preventDefault();
              const element = event.currentTarget;
              const handle = element.closest('[data-project-task-id]');
              if (!handle) return;
              const startY = event.clientY;
              let moved = false;
              let targetId = null;
              const clear = () => {
                window.removeEventListener('pointermove', move);
                window.removeEventListener('pointerup', end);
                window.removeEventListener('pointercancel', cancel);
                if (handle) { handle.style.opacity = ''; handle.style.outline = ''; }
                for (const row of document.querySelectorAll('[data-project-task-id]')) row.style.boxShadow = '';
                dragProjectTask.current = null;
                projectDragCleanup.current = null;
              };
              const move = e => {
                if (Math.abs(e.clientY - startY) > 5) moved = true;
                if (!moved) return;
                handle.style.opacity = '.65';
                for (const row of document.querySelectorAll('[data-project-task-id]')) row.style.boxShadow = '';
                const el = document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-project-task-id]');
                const id = el?.getAttribute('data-project-task-id');
                if (id && id !== task.id && el.getAttribute('data-project-status') === task.status) {
                  targetId = id;
                  el.style.boxShadow = 'inset 0 3px #a58bd8';
                } else targetId = null;
              };
              const end = () => { const id = targetId; clear(); if (moved && id) moveProjectTask(task.id,id); };
              const cancel = () => clear();
              dragProjectTask.current = task.id;
              window.addEventListener('pointermove',move,{passive:true});
              window.addEventListener('pointerup',end);
              window.addEventListener('pointercancel',cancel);
              projectDragCleanup.current = clear;
            };
          '''
          replace_once(anchor, insert+anchor)
          # Override old arrow controls only inside project list.
          start=s.index('  function Projects() {');end=s.index('  function ',start+8) if '  function ' in s[start+8:] else len(s)
          part=s[start:end]
          part,n=re.subn(r'          <div style=\{\{display:"flex",flexDirection:"column"\}\}><button type="button" aria-label="위로 이동".*?</div>', '''          <button type="button" aria-label="길게 눌러 순서 변경" onPointerDown={e=>startProjectDrag(e,t)} style={{touchAction:"none",cursor:"grab",fontSize:22,color:"#9f8db7",padding:"8px",userSelect:"none",flexShrink:0}}>⠿</button>''',part,count=1,flags=re.S)
          if n!=1:raise RuntimeError('Arrows not found')
          part=part.replace('<div key={t.id} className="project-item-wrap">','<div key={t.id} className="project-item-wrap" data-project-task-id={t.id} data-project-status={t.status}>',1)
          needle='''            <button
                        className="secondary add-only"'''
          if needle not in part: raise RuntimeError('project add button not found')
          part=part.replace(needle,'''            <button type="button" className="secondary" onClick={deleteSelectedProject} aria-label="선택 프로젝트 삭제" style={{marginLeft:"auto",padding:"10px",color:"#bf667c"}}><Trash2 size={18}/></button>
          '''+needle,1)
          # Ensure project selection still works with an empty list.
          part=part.replace('value={selectedProject}', 'value={selected?.id || ""}',1)
          s=s[:start]+part+s[end:]
          # Remove whitespace not meaningful to JSX, as previous commits failed GitHub whitespace check.
          s='\n'.join(line.rstrip(' \t\r') for line in s.split('\n'))
          assert 'data-project-task-id' in s and 'deleteSelectedProject' in s and 'moveProjectTask' in s
          assert original!=s
          p.write_text(s,encoding='utf-8')
          print('Project drag handle, consistent persisted order and safe project deletion applied.')
          
          PY
      - name: Verify production build
        run: |
          npm ci
          npm run build
      - name: Commit changed source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No source changes'; exit 0; fi
          git commit -m 'Enable project task pointer reorder and safe project deletion'
          git push origin HEAD:main
