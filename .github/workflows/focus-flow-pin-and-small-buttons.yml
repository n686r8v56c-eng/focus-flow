name: Focus Flow - Pin Tasks and Compact Project Buttons
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply pin and compact project buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/App.jsx');s=p.read_text(encoding='utf-8')
          # Remove obsolete drag mechanics as a unit.
          a=s.index('  const moveProjectTask = (');b=s.index('  const removeTask = (',a)
          s=s[:a]+'''  const [pinMenuId, setPinMenuId] = useState(null);
            const pinHold = useRef(null);
            const pinHoldOrigin = useRef(null);
            const clearPinHold = () => {
              if (pinHold.current) clearTimeout(pinHold.current);
              pinHold.current = null;
              pinHoldOrigin.current = null;
            };
            useEffect(() => () => clearPinHold(), []);
            const beginPinHold = (event, id) => {
              if (event.pointerType === "mouse" && event.button !== 0) return;
              clearPinHold();
              pinHoldOrigin.current = {x:event.clientX,y:event.clientY,pointerId:event.pointerId};
              pinHold.current = setTimeout(() => {
                setPinMenuId(id);
                pinHold.current = null;
                pinHoldOrigin.current = null;
              }, 550);
            };
            const trackPinHold = event => {
              const origin=pinHoldOrigin.current;
              if (origin && (Math.abs(event.clientX-origin.x)>12 || Math.abs(event.clientY-origin.y)>12)) clearPinHold();
            };
            const togglePin = task => {
              update(d => {
                const group=d.tasks.filter(t=>t.projectId===task.projectId && Number.isFinite(t.pinOrder));
                const next=group.reduce((m,t)=>Math.max(m,t.pinOrder),0)+1;
                return {...d,tasks:d.tasks.map(t=>t.id===task.id?{...t,pinOrder:Number.isFinite(t.pinOrder)?null:next}:t)};
              });
              setPinMenuId(null);
            };
          ''' +s[b:]
          # always render pinned items first, order pinned by creation sequence and unpinned by existing dropdown
          old='items = data.tasks.filter((t) => t.projectId === selectedProject).sort((a,b)=>projectSort === "manual" ? ((a.order??0)-(b.order??0)||(a.due||"9999").localeCompare(b.due||"9999")||(a.time||"").localeCompare(b.time||"")) : projectSortCompare(a,b)), '
          # allow absence trailing space
          pattern=r'items = data\.tasks\.filter\(\(t\) => t\.projectId === selectedProject\)\.sort\(\(a,b\)=>projectSort === "manual" \? \(\(a\.order\?\?0\).*? : projectSortCompare\(a,b\)\),'
          replacement='''items = data.tasks.filter((t) => t.projectId === selectedProject).sort((a,b)=>{
                  const ap=Number.isFinite(a.pinOrder),bp=Number.isFinite(b.pinOrder);
                  if(ap!==bp)return ap?-1:1;
                  if(ap && bp)return a.pinOrder-b.pinOrder;
                  return projectSort === "manual"
                    ? (a.order??0)-(b.order??0)||(a.due||"9999").localeCompare(b.due||"9999")||(a.time||"").localeCompare(b.time||"")
                    : projectSortCompare(a,b);
                }),'''
          s,n=re.subn(pattern,replacement,s,count=1)
          assert n==1, 'sort expression changed'
          # remove drag handle
          s,n=re.subn(r'\s*<button type="button" aria-label="드래그하여 순서 변경"[^\n]*>⠿</button>', '',s,count=1)
          assert n==1,'drag button not found'
          # attach pointer to row, prevent native context menu
          old='<div key={t.id} className="project-item-wrap" data-project-task-id={t.id} data-project-status={t.status}>'
          new='''<div key={t.id} className="project-item-wrap" data-project-task-id={t.id}
                  onPointerDown={e => { if(!e.target.closest('button,input,a,select')) beginPinHold(e,t.id); }}
                  onPointerMove={trackPinHold}
                  onPointerUp={clearPinHold}
                  onPointerCancel={clearPinHold}
                  onContextMenu={e => { e.preventDefault(); clearPinHold(); setPinMenuId(t.id); }}
                  style={{WebkitTouchCallout:'none'}}>'''
          assert old in s;s=s.replace(old,new,1)
          # avoid clicking title when menu displayed
          s=s.replace('className="list-middle" onClick={() => setEditing(t.id)}','className="list-middle" onClick={() => {if(pinMenuId!==t.id)setEditing(t.id)}}',1)
          # pinned star visible near task title
          needle='''            <strong className={t.status === "done" ? "struck" : ""}>
                        {t.title}
                      </strong>'''
          assert needle in s;s=s.replace(needle,'''            <strong className={t.status === "done" ? "struck" : ""}>
                        {Number.isFinite(t.pinOrder) ? '⭐ ' : ''}{t.title}
                      </strong>''',1)
          # inline menu after row, not a separate row, no drag
          needle='''        {t.subtasks.length > 0 && ('''
          idx=s.index('const renderItem = (t)');i=s.index(needle,idx)
          s=s[:i]+'''        {pinMenuId === t.id && (
                    <div style={{display:'flex',justifyContent:'flex-end',alignItems:'center',gap:8,padding:'8px 12px',background:'#f7f2ff'}}>
                      <button type="button" onClick={e=>{e.stopPropagation();togglePin(t)}} style={{padding:'10px 14px',borderRadius:10,background:'#fff',color:'#8061b6',fontWeight:700}}>
                        {Number.isFinite(t.pinOrder) ? '☆ 고정 해제' : '⭐ 맨 위에 고정'}
                      </button>
                      <button type="button" onClick={e=>{e.stopPropagation();setPinMenuId(null)}} style={{padding:'10px',color:'#8a8195'}}>닫기</button>
                    </div>
                  )}
          ''' +s[i:]
          # suppression doesn't include deep nested touch context, okay
          # Make the three project-header controls compact, close to the title's visual size.
          summary_start=s.index('<div className="project-summary">')
          summary_end=s.index('<div className="project-task-list">',summary_start)
          summary=s[summary_start:summary_end]
          for label in ('선택 프로젝트 이름 수정','선택 프로젝트 삭제','투두 추가'):
              assert summary.count('aria-label="'+label+'"') == 1, f'header button missing: {label}'
          summary=summary.replace('style={{marginLeft:"auto",padding:"10px",color:"#8d6dce"}}><Pencil size={18}/>','style={{marginLeft:"auto",padding:"6px",minWidth:34,minHeight:34,color:"#8d6dce"}}><Pencil size={16}/>',1)
          summary=summary.replace('style={{padding:"10px",color:"#bf667c"}}><Trash2 size={18}/>','style={{padding:"6px",minWidth:34,minHeight:34,color:"#bf667c"}}><Trash2 size={16}/>',1)
          summary=summary.replace('<Plus size={22} />','<Plus size={17} />',1)
          summary=summary.replace('className="secondary add-only"','className="secondary add-only project-add-compact"',1)
          s=s[:summary_start]+summary+s[summary_end:]
          # Reduce + button box in addition to its icon; keep touch targets usable.
          cssp=Path('src/style.css')
          css=cssp.read_text(encoding='utf-8')
          rule='''.project-summary .project-add-compact { min-width:34px; min-height:34px; width:34px; height:34px; padding:6px; border-radius:10px; flex-shrink:0; }
          .project-summary button[aria-label="선택 프로젝트 이름 수정"], .project-summary button[aria-label="선택 프로젝트 삭제"] { width:34px; height:34px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
          '''
          if '.project-summary .project-add-compact' not in css:
              css += '\n' + rule
              cssp.write_text('\n'.join(line.rstrip() for line in css.split('\n')),encoding='utf-8')
          s='\n'.join(x.rstrip() for x in s.split('\n'))
          p.write_text(s,encoding='utf-8')
          assert 'startProjectDrag' not in s and '드래그하여 순서 변경' not in s
          assert 'Number.isFinite(a.pinOrder)' in s
          PY
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/style.css
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Already updated'; exit 0; fi
          git commit -m 'Replace drag with ordered pins and compact project controls'
          git push origin HEAD:main
