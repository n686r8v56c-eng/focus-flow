      - name: Check complete feature set and production build
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          s=Path('src/App.jsx').read_text()
          checks={'카르마 탭':'KarmaPanel','횟수형 할 일':'tallies','분석 화면':'카테고리 분석','날짜 이동':'visibleDate','종료음 설정':'alarmEnabled','원형 타이머':'onPointerMove','녹음 시계 음향':'clock-audio.js','학습·운동·명상 연동':'LinkedActivities'}
          missing=[k for k,v in checks.items() if v not in s]
          if missing: raise SystemExit('Missing features: '+', '.join(missing))
          for path in ['src/LinkedActivities.jsx','src/HomeWorkouts.jsx','src/clock-audio.js']:
            if not Path(path).exists(): raise SystemExit('Missing required existing file: '+path)
          print('Verified all required feature markers and linked source files.')
          PYCODE
          npm run build
          git diff --check
      - name: Commit verified updates only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/LinkedActivities.jsx src/HomeWorkouts.jsx
          if git diff --cached --quiet; then
            echo 'No changes; everything was already applied.'
            exit 0
          fi
          git commit -m 'Add Focus Flow task, calendar, analytics, Karma and app shortcuts'
          git push origin HEAD:main
