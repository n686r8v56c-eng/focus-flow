name: Focus Flow - Apply All Updates (No Codespaces)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read latest main source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply all guarded updates
