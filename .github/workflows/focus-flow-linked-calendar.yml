name: Focus Flow - Linked Calendar and Equal Cells
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: focus-flow-calendar-patch
  cancel-in-progress: false
jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Add connected calendar and equal-sized date cells
        shell: bash
        run: |
          mkdir -p src
          base64 -d > src/CalendarExternal.jsx <<'END_COMPONENT'
          
          END_COMPONENT
          base64 -d > /tmp/patch-calendar.py <<'END_PATCH'
          
          END_PATCH
          python3 /tmp/patch-calendar.py
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Commit only verified source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/CalendarExternal.jsx src/style.css
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Already applied'; exit 0; fi
          git commit -m 'Show linked studies workouts and meditation in calendar; align today cell'
          git push origin HEAD:main
