name: Focus Flow - Date Row Navigation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Move navigation next to date
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path("src/App.jsx")
          s=p.read_text(encoding="utf-8")
          a=s.index('className="today-heading-compact"')
          b=s.index('<section aria-label="오늘의 할 일 체크리스트"',a)
          part=s[a:b]
          nav="""              <div aria-label="날짜 이동" style={{display:'inline-flex',alignItems:'center',gap:1,flexShrink:0,color:'#9484a5',fontSize:11,fontWeight:600,whiteSpace:'nowrap'}}>
                          <button type="button" aria-label="어제" onClick={()=>setViewDate(d=>dayAdd(d,-1))} style={{padding:'2px',minWidth:18,background:'transparent',color:'inherit',border:0}}><ChevronLeft size={13}/></button>
                          <span>{visibleDate===today?'오늘':new Date(visibleDate+'T12:00:00').getDate()+'일'}</span>
                          <button type="button" aria-label="내일" onClick={()=>setViewDate(d=>dayAdd(d,1))} style={{padding:'2px',minWidth:18,background:'transparent',color:'inherit',border:0}}><ChevronRight size={13}/></button>
                        </div>"""
          if part.count(nav)!=1: raise SystemExit("Date navigation markup changed; refusing edit")
          part=part.replace(nav,'',1)
          anchor="""              {new Date(visibleDate+'T12:00:00').toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}
          """
          if part.count(anchor)!=1: raise SystemExit("Date label changed; refusing edit")
          replacement=anchor+"""              <span aria-label="날짜 이동" style={{display:'inline-flex',alignItems:'center',gap:3,marginLeft:10,fontSize:12,fontWeight:600,color:'#957bb6',whiteSpace:'nowrap'}}>
                          <button type="button" aria-label="어제" onClick={()=>setViewDate(d=>dayAdd(d,-1))} style={{padding:2,minWidth:20,background:'transparent',color:'inherit',border:0}}><ChevronLeft size={14}/></button>
                          <span>{visibleDate===today?'오늘':new Date(visibleDate+'T12:00:00').getDate()+'일'}</span>
                          <button type="button" aria-label="내일" onClick={()=>setViewDate(d=>dayAdd(d,1))} style={{padding:2,minWidth:20,background:'transparent',color:'inherit',border:0}}><ChevronRight size={14}/></button>
                        </span>
          """
          part=part.replace(anchor,replacement,1)
          s=s[:a]+part+s[b:]
          p.write_text('\n'.join(line.rstrip() for line in s.splitlines())+'\n',encoding='utf-8')
          print('Moved date navigation to date label')
          PYCODE
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Move Today navigation alongside date"
            git push
          fi
