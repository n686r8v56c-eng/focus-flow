name: Focus Flow - Drag Handle Left and Feedback
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Move handle and enhance drag feedback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text(encoding='utf-8')
          handle='''          <button type="button" aria-label="드래그하여 순서 변경" onPointerDown={e=>startProjectDrag(e,t)} onContextMenu={e=>e.preventDefault()} onDragStart={e=>e.preventDefault()} style={{touchAction:"none",WebkitUserSelect:"none",WebkitTouchCallout:"none",cursor:"grab",fontSize:22,color:"#9f8db7",padding:"8px",userSelect:"none",flexShrink:0}}>⠿</button>'''
          if s.count(handle)!=1: raise SystemExit('Expected exactly one existing drag handle; file version differs')
          s=s.replace(handle+'\n','',1)
          first='''        <div className="project-list-item">
          <button
            className={"check-btn "'''
          if s.count(first)!=1: raise SystemExit('Project task row anchor not unique')
          new_handle=handle.replace('padding:"8px"','padding:"10px 6px"').replace('fontSize:22','fontSize:24')
          s=s.replace(first,'''        <div className="project-list-item">
          '''+new_handle+'''
          <button
            className={"check-btn "''',1)
          old='''    const startY = event.clientY;
              let targetId = null;'''
          new='''    const startY = event.clientY;
              let targetId = null;
              const prior = { transform: row.style.transform, boxShadow: row.style.boxShadow, background: row.style.background, opacity: row.style.opacity, transition: row.style.transition, zIndex: row.style.zIndex, position: row.style.position };
              row.style.transition = 'transform 120ms ease, box-shadow 120ms ease, background 120ms ease';
              row.style.transform = 'scale(1.025)';
              row.style.boxShadow = '0 8px 24px rgba(127,97,181,.24), inset 0 0 0 2px #a58bd8';
              row.style.background = '#f7f2ff';
              row.style.position = 'relative';
              row.style.zIndex = '3';
              if (navigator.vibrate) try { navigator.vibrate(12); } catch {}'''
          if s.count(old)!=1:raise SystemExit('Drag setup anchor missing')
          s=s.replace(old,new,1)
          s=s.replace("      row.style.opacity = '.7';", "      row.style.opacity = '.88';",1)
          s=s.replace("      if (targetId) target.style.boxShadow = 'inset 0 3px #a58bd8';", "      if (targetId) target.style.boxShadow = 'inset 0 4px #a58bd8, 0 0 0 2px #a58bd8';",1)
          old_cleanup='''      row.style.opacity = '';
                resetHighlights();'''
          new_cleanup='''      Object.entries(prior).forEach(([key,value]) => {row.style[key] = value;});
                resetHighlights();'''
          if s.count(old_cleanup)!=1:raise SystemExit('Drag cleanup anchor missing')
          s=s.replace(old_cleanup,new_cleanup,1)
          # Prevent the reset loop from overwriting the active source card's purple shadow.
          s=s.replace("for (const item of document.querySelectorAll('[data-project-task-id]')) item.style.boxShadow = '';", "for (const item of document.querySelectorAll('[data-project-task-id]')) if (item !== row) item.style.boxShadow = '';",1)
          # Always normalize newly generated trailing spaces before git whitespace validation.
          s='\n'.join(line.rstrip(' \\t\\r') for line in s.split('\n'))
          p.write_text(s,encoding='utf-8')
          PY
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Already applied'; exit 0; fi
          git commit -m 'Move project task drag handle left and add clear iOS drag feedback'
          git push origin HEAD:main
