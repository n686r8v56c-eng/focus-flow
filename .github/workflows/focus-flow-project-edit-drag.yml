name: Focus Flow - Project Rename and iPhone Drag Fix
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: focus-flow-project-edit-drag
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply project name edit and mobile handle fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/App.jsx')
          s=p.read_text(encoding='utf-8')
          if 'Pencil,' not in s:
              s=s.replace('  Trash2,\n','  Trash2,\n  Pencil,\n',1)
          if 'const renameSelectedProject = () =>' not in s:
              anchor='  const deleteSelectedProject = () => {'
              if anchor not in s:raise SystemExit('Project delete anchor missing; source version changed')
              rename='''  const renameSelectedProject = () => {
            const target = data.projects.find(p => p.id === selectedProject);
            if (!target) return;
            const next = window.prompt("프로젝트 이름 수정", target.name);
            if (next === null || !next.trim() || next.trim() === target.name) return;
            update(d => ({ ...d, projects: d.projects.map(p => p.id === target.id ? {...p, name: next.trim()} : p) }));
          };
          '''
              s=s.replace(anchor,rename+anchor,1)
          if 'aria-label="선택 프로젝트 이름 수정"' not in s:
              marker='<button type="button" className="secondary" onClick={deleteSelectedProject}'
              if marker not in s:raise SystemExit('Delete button anchor missing')
              edit='<button type="button" className="secondary" onClick={renameSelectedProject} aria-label="선택 프로젝트 이름 수정" style={{marginLeft:"auto",padding:"10px",color:"#8d6dce"}}><Pencil size={18}/></button>\n            '
              s=s.replace(marker,edit+marker,1)
              s=s.replace('onClick={deleteSelectedProject} aria-label="선택 프로젝트 삭제" style={{marginLeft:"auto",','onClick={deleteSelectedProject} aria-label="선택 프로젝트 삭제" style={{',1)
          # Use immediate touch/pointer dragging. iOS must not interpret the handle as a selectable text region.
          start=s.index('  const startProjectDrag = (event, task) => {')
          end=s.index('  const removeTask = (id) => {',start)
          s=s[:start]+'''  const startProjectDrag = (event, task) => {
              if (event.pointerType === "mouse" && event.button !== 0) return;
              event.preventDefault();
              projectDragCleanup.current?.();
              const button = event.currentTarget;
              const row = button.closest('[data-project-task-id]');
              if (!row) return;
              try { button.setPointerCapture(event.pointerId); } catch {}
              const startY = event.clientY;
              let targetId = null;
              const resetHighlights = () => {
                for (const item of document.querySelectorAll('[data-project-task-id]')) item.style.boxShadow = '';
              };
              const move = e => {
                if (e.pointerId !== event.pointerId) return;
                e.preventDefault();
                resetHighlights();
                row.style.opacity = '.7';
                // Hide the pointer-captured handle when hit-testing the target row.
                const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-project-task-id]');
                const id = target?.getAttribute('data-project-task-id');
                targetId = id && id !== task.id && target.getAttribute('data-project-status') === task.status ? id : null;
                if (targetId) target.style.boxShadow = 'inset 0 3px #a58bd8';
                // Intentionally do not reorder in pointermove; commit exactly once on release.
              };
              const cleanup = () => {
                window.removeEventListener('pointermove',move);
                window.removeEventListener('pointerup',end);
                window.removeEventListener('pointercancel',cancel);
                try { button.releasePointerCapture(event.pointerId); } catch {}
                row.style.opacity = '';
                resetHighlights();
                projectDragCleanup.current = null;
              };
              const end = e => {
                if (e.pointerId !== event.pointerId) return;
                const id = targetId;
                cleanup();
                if (id && Math.abs(e.clientY-startY) >= 6) moveProjectTask(task.id,id);
              };
              const cancel = () => cleanup();
              window.addEventListener('pointermove',move,{passive:false});
              window.addEventListener('pointerup',end);
              window.addEventListener('pointercancel',cancel);
              projectDragCleanup.current = cleanup;
            };
          ''' + s[end:]
          handle=r'<button type="button" aria-label="길게 눌러 순서 변경" onPointerDown={e=>startProjectDrag(e,t)} style={{touchAction:"none",cursor:"grab",fontSize:22,color:"#9f8db7",padding:"8px",userSelect:"none",flexShrink:0}}>⠿</button>'
          replacement=r'<button type="button" aria-label="드래그하여 순서 변경" onPointerDown={e=>startProjectDrag(e,t)} onContextMenu={e=>e.preventDefault()} onDragStart={e=>e.preventDefault()} style={{touchAction:"none",WebkitUserSelect:"none",WebkitTouchCallout:"none",cursor:"grab",fontSize:22,color:"#9f8db7",padding:"8px",userSelect:"none",flexShrink:0}}>⠿</button>'
          if handle in s:s=s.replace(handle,replacement,1)
          else:
              if 'aria-label="드래그하여 순서 변경"' not in s:raise SystemExit('Drag handle pattern not found')
          p.write_text('\n'.join(line.rstrip(' \t\r') for line in s.split('\n')),encoding='utf-8')
          css=Path('src/style.css')
          c=css.read_text(encoding='utf-8')
          marker='/* Safari project drag handle protection */'
          if marker not in c:
              c+='\n'+marker+'\n.project-item-wrap button[aria-label="드래그하여 순서 변경"] { touch-action:none!important; user-select:none!important; -webkit-user-select:none!important; -webkit-touch-callout:none!important; }\n'
          css.write_text('\n'.join(line.rstrip(' \t\r') for line in c.split('\n')),encoding='utf-8')
          assert 'aria-label="선택 프로젝트 이름 수정"' in s
          assert 'onContextMenu={e=>e.preventDefault()}' in s
          assert '▲</button>' not in s
          PY
      - name: Install and test build
        run: |
          npm ci
          npm run build
      - name: Commit only verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/style.css
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Already applied'; exit 0; fi
          git commit -m 'Fix iOS drag handle and add project name editing'
          git push origin HEAD:main
