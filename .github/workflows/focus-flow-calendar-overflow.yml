name: Focus Flow - Calendar Extra Count
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: focus-flow-calendar-extra-count
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Add extra count to calendar dots
        run: |
          echo  | base64 -d > /tmp/fix_dots.py
          python3 /tmp/fix_dots.py
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Commit verified calendar fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for f in ('src/App.jsx','src/style.css'):
              p=Path(f)
              s=p.read_text(encoding='utf-8')
              p.write_text('\n'.join(line.rstrip(' \t\r') for line in s.split('\n')),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/style.css
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Already updated'; exit 0; fi
          git commit -m 'Show +N for additional calendar tasks after five dots'
          git push origin HEAD:main
